name: Build and deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-cpsy300-project-eric
  CONTAINERAPP: ca-recipes-eric

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The registry name ends in 4 random digits and changes after
      # `setup-azure.sh down` + `up`, so look it up instead of hard-coding it.
      - name: Find the registry
        run: |
          ACR_NAME=$(az acr list -g "$RESOURCE_GROUP" --query "[?starts_with(name, 'acrcpsy300')].name | [0]" -o tsv)
          if [ -z "$ACR_NAME" ]; then
            echo "::error::No acrcpsy300* registry in $RESOURCE_GROUP. Run ./setup-azure.sh up first."
            exit 1
          fi
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
      - name: Sign in to the registry
        run: az acr login --name "$ACR_NAME"
      - name: Build and push
        run: |
          IMAGE=$ACR_NAME.azurecr.io/recipes:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy
        run: |
          az containerapp update \
            --name "$CONTAINERAPP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/recipes:${{ github.sha }}"
